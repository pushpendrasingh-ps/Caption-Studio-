name: Build CaptionStudio APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Web App
        run: |
          npm install --legacy-peer-deps
          npx vite build --base=./
      - name: Wrap into Android APK (Capacitor + Native Save & KeepAwake)
        run: |
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor-community/keep-awake@6
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.captionstudio.pro",
            "appName": "CaptionStudio",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap sync android
      - name: Compile APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CaptionStudio-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
